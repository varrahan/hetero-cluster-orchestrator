apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestration-optical-dra
  namespace: slurm-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orchestration-optical-dra
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list, watch, update, patch]
- apiGroups: [resource.k8s.io]
  resources: [resourceclaims]
  verbs: [get]
- apiGroups: [resource.k8s.io]
  resources: [resourceslices]
  verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orchestration-optical-dra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orchestration-optical-dra
subjects:
- kind: ServiceAccount
  name: orchestration-optical-dra
  namespace: slurm-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: orchestration-optical-dra
  namespace: slurm-system
spec:
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: orchestration-optical-dra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchestration-optical-dra
    spec:
      serviceAccountName: orchestration-optical-dra
      nodeSelector:
        orchestration.gputpu.io/compute: "true"
      tolerations:
      - key: orchestration.gputpu.io/compute
        operator: Exists
        effect: NoSchedule
      - key: orchestration.gputpu.io/hardware-degraded
        operator: Exists
        effect: NoSchedule
      containers:
      - name: driver
        image: orchestration-optical-dra:dev
        securityContext:
          privileged: true
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: plugin
          mountPath: /var/lib/kubelet/plugins/orchestration.optical.gputpu.io
        - name: registry
          mountPath: /var/lib/kubelet/plugins_registry
      volumes:
      - name: plugin
        hostPath:
          path: /var/lib/kubelet/plugins/orchestration.optical.gputpu.io
          type: DirectoryOrCreate
      - name: registry
        hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: Directory
