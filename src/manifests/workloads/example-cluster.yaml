apiVersion: orchestration.gputpu.io/v1alpha1
kind: HeterogeneousCluster
metadata:
  name: research
  namespace: slurm-system
spec:
  controlPlane:
    controllers:
      image: slurm-control-plane:25.11.7
      stateSaveClaim: slurm-state-rwx
    accounting:
      databaseSecretRef: slurm-mariadb
    login:
      replicas: 1
  authentication:
    mungeKeySecretRef: slurm-munge
    jwtKeySecretRef: slurm-jwt
  workerPools:
  - name: strict
    partition: compute
    nodeSelector:
      orchestration.gputpu.io/compute-node: "true"
    memoryUnit: 1Gi
    scaling:
      minReady: 0
      maxWorkers: 32
      idleTimeout: 5m
    profiles:
    - name: rtx-4050
      gres: gpu:rtx_4050
      deviceClassName: nvidia.orchestration.gputpu.io
