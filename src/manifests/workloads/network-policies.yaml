apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: slurm-system
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: slurm-operator-observability
  namespace: slurm-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: slurm-operator
  policyTypes: [Ingress]
  ingress:
  - ports:
    - {port: health, protocol: TCP}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - {port: metrics, protocol: TCP}
