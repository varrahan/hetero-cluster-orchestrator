apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: quantization-engine
  namespace: slurm-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: quantization-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantization-engine
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        orchestration.gputpu.io/compute: "true"
      tolerations:
      - key: orchestration.gputpu.io/compute
        operator: Exists
        effect: NoSchedule
      containers:
      - name: engine
        image: quantization-engine:dev
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        readinessProbe:
          exec:
            command: [test, -S, /run/gputpu-quantization/engine.sock]
        volumeMounts:
        - name: shared-memory
          mountPath: /dev/shm/ai-orch
        - name: socket
          mountPath: /run/gputpu-quantization
      volumes:
      - name: shared-memory
        hostPath:
          path: /dev/shm/ai-orch
          type: DirectoryOrCreate
      - name: socket
        hostPath:
          path: /run/gputpu-quantization
          type: DirectoryOrCreate
