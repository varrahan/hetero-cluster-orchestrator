apiVersion: v1
kind: ServiceAccount
metadata:
  name: slurm-operator
  namespace: slurm-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: slurm-operator
  namespace: slurm-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: slurm-operator
subjects:
- kind: ServiceAccount
  name: slurm-operator
  namespace: slurm-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slurm-operator
  namespace: slurm-system
  labels:
    app.kubernetes.io/name: slurm-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: slurm-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slurm-operator
    spec:
      serviceAccountName: slurm-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
      - name: operator
        image: slurm-operator:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: metrics
          containerPort: 8080
        - name: probes
          containerPort: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: probes
        livenessProbe:
          httpGet:
            path: /healthz
            port: probes
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: slurm-operator
  namespace: slurm-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slurm-operator
